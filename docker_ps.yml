---
- name: Run docker ps on Linux hosts
  hosts: all
  gather_facts: no

  vars:
    # Include stopped containers as well
    docker_ps_all: false
    # Provide a custom --format string, e.g. "{{.ID}} {{.Names}} {{.Status}}"
    docker_ps_format: ""
    # Optionally hardcode docker binary path if not in PATH (e.g. /usr/bin/docker)
    docker_bin: ""
    # Use sudo to run docker commands (recommended unless user is in docker group)
    use_sudo: true

  tasks:
    - name: Locate docker binary in PATH
      ansible.builtin.command: "command -v docker"
      register: docker_path
      changed_when: false
      failed_when: false

    - name: Resolve docker executable
      ansible.builtin.set_fact:
        docker_exec: "{{ docker_bin if (docker_bin | length) > 0 else (docker_path.stdout_lines[0] | default('docker')) }}"

    - name: Build argv for docker ps
      ansible.builtin.set_fact:
        docker_ps_argv: >-
          {{
            [docker_exec, 'ps']
            + (docker_ps_all | ternary(['-a'], []))
            + ((docker_ps_format | length > 0) | ternary(['--format', docker_ps_format], []))
          }}

    - name: Check sudo nopasswd availability
      ansible.builtin.command: "sudo -n -v"
      register: sudo_check
      changed_when: false
      failed_when: false
      when: use_sudo

    - name: Decide effective use of sudo
      ansible.builtin.set_fact:
        effective_use_sudo: "{{ use_sudo and ((sudo_check.rc | default(1)) == 0) }}"
      when: use_sudo

    - name: Default effective_use_sudo when sudo not requested
      ansible.builtin.set_fact:
        effective_use_sudo: false
      when: not use_sudo

    - name: Run docker ps
      ansible.builtin.command:
        argv: "{{ docker_ps_argv }}"
      register: docker_ps_out
      changed_when: false
      failed_when: false
      become: "{{ effective_use_sudo | default(false) }}"
      become_method: sudo
      when: (docker_path.rc | default(1)) == 0 or (docker_bin | length) > 0

    - name: Info when sudo requested but not passwordless
      ansible.builtin.debug:
        msg: "sudo requires password; running docker ps without sudo"
      when: use_sudo and not (effective_use_sudo | default(false))

    - name: Docker not found, skipping
      ansible.builtin.debug:
        msg: "Docker not found on host. Skipping docker ps."
      when: (docker_path.rc | default(1)) != 0 and (docker_bin | length) == 0

    - name: Show docker ps output
      ansible.builtin.debug:
        msg: "{{ docker_ps_out.stdout_lines | default([]) }}"


