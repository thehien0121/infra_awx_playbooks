---
- name: Check Error Logs on CentOS/Ubuntu
  hosts: all
  gather_facts: no

  vars:
    # Số dòng error cuối cùng muốn hiển thị (để trống hoặc 0 để hiển thị tất cả)
    error_lines_count: 50
    # Các từ khóa để tìm error (có thể tùy chỉnh)
    error_keywords:
      - error
      - ERROR
      - failed
      - FAILED
      - critical
      - CRITICAL
      - fatal
      - FATAL
      - exception
      - EXCEPTION

  tasks:
    - name: Detect OS by checking log files (fallback method)
      shell: |
        if [ -f /var/log/messages ]; then
          echo "redhat"
        elif [ -f /var/log/syslog ]; then
          echo "debian"
        else
          echo "unknown"
        fi
      register: os_detect_by_log
      changed_when: false
      failed_when: false

    - name: Try to detect OS by reading /etc/os-release (without sudo)
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "$ID"
          echo "$VERSION_ID"
          echo "$NAME"
        elif [ -f /etc/redhat-release ]; then
          cat /etc/redhat-release
        elif [ -f /etc/lsb-release ]; then
          . /etc/lsb-release
          echo "$DISTRIB_ID"
          echo "$DISTRIB_RELEASE"
        else
          echo ""
        fi
      register: os_detect
      changed_when: false
      failed_when: false

    - name: Try to detect OS by reading /etc/os-release (with sudo)
      shell: |
        if [ -f /etc/os-release ]; then
          . /etc/os-release
          echo "$ID"
          echo "$VERSION_ID"
          echo "$NAME"
        elif [ -f /etc/redhat-release ]; then
          cat /etc/redhat-release
        elif [ -f /etc/lsb-release ]; then
          . /etc/lsb-release
          echo "$DISTRIB_ID"
          echo "$DISTRIB_RELEASE"
        else
          echo ""
        fi
      become: yes
      become_method: sudo
      register: os_detect_sudo
      when: os_detect.stdout == "" or os_detect.stdout_lines | length == 0
      changed_when: false
      failed_when: false

    - name: Initialize os_detect_sudo if not defined
      set_fact:
        os_detect_sudo: {"stdout": "", "stdout_lines": []}
      when: os_detect_sudo is not defined

    - name: Set final OS detection result
      set_fact:
        os_detect_final: "{{ os_detect_sudo if (os_detect_sudo.stdout is defined and os_detect_sudo.stdout != '') else (os_detect if os_detect.stdout is defined else {'stdout': '', 'stdout_lines': []}) }}"

    - name: Initialize OS variables from log files
      set_fact:
        os_id: "{{ os_detect_by_log.stdout | default('unknown') | lower }}"
        os_version: "unknown"
        os_name: "{{ 'CentOS/RHEL' if os_detect_by_log.stdout == 'redhat' else ('Ubuntu/Debian' if os_detect_by_log.stdout == 'debian' else 'Unknown') }}"

    - name: Parse OS information from /etc/os-release (if available)
      set_fact:
        os_id: "{{ os_detect_final.stdout_lines[0] | default(os_id) | lower }}"
        os_version: "{{ os_detect_final.stdout_lines[1] | default(os_version) }}"
        os_name: "{{ os_detect_final.stdout_lines[2] | default(os_detect_final.stdout_lines[0] | default(os_name)) }}"
      when: 
        - os_detect_final.stdout is defined
        - os_detect_final.stdout != ""
        - os_detect_final.stdout_lines | length > 0

    - name: Determine OS family
      set_fact:
        is_redhat_family: "{{ os_id in ['rhel', 'centos', 'rocky', 'almalinux', 'fedora', 'oracle', 'redhat'] or 'redhat' in (os_id | default('')) or os_detect_by_log.stdout | default('') == 'redhat' }}"
        is_debian_family: "{{ os_id in ['ubuntu', 'debian'] or os_detect_by_log.stdout | default('') == 'debian' }}"

    - name: Set log file path based on OS
      set_fact:
        log_file: "{{ '/var/log/messages' if is_redhat_family else '/var/log/syslog' }}"
        os_family: "{{ 'RedHat' if is_redhat_family else ('Debian' if is_debian_family else 'Unknown') }}"

    - name: Display OS information
      debug:
        msg: 
          - "Detected OS: {{ os_name }} ({{ os_id }}) {{ os_version }}"
          - "OS Family: {{ os_family }}"
          - "Using log file: {{ log_file }}"

    - name: Try to read error logs without sudo (RedHat family)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      register: error_logs
      when: is_redhat_family
      changed_when: false
      failed_when: false

    - name: Try to read error logs without sudo (Debian family)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      register: error_logs
      when: is_debian_family
      changed_when: false
      failed_when: false

    - name: Set needs_sudo flag
      set_fact:
        needs_sudo: "{{ (error_logs.rc is defined and error_logs.rc != 0) or (error_logs.stdout is not defined) or (error_logs.stdout == '') }}"
      when: error_logs is defined

    - name: Initialize needs_sudo if not set
      set_fact:
        needs_sudo: false
      when: error_logs is not defined or needs_sudo is not defined

    - name: Read error logs with sudo (RedHat family)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      become: yes
      become_method: sudo
      register: error_logs
      when: 
        - is_redhat_family
        - needs_sudo
      changed_when: false
      failed_when: false

    - name: Read error logs with sudo (Debian family)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      become: yes
      become_method: sudo
      register: error_logs
      when: 
        - is_debian_family
        - needs_sudo
      changed_when: false
      failed_when: false

    - name: Display error logs
      debug:
        msg: "{{ error_logs.stdout_lines }}"
      when: 
        - error_logs is defined
        - error_logs.stdout_lines is defined
        - error_logs.stdout_lines | length > 0

    - name: Show message if no errors found
      debug:
        msg: "✅ No error logs found in {{ log_file }}"
      when: 
        - error_logs is defined
        - (error_logs.stdout_lines is not defined) or (error_logs.stdout_lines | length == 0)

    - name: Count total error lines
      set_fact:
        total_error_lines: "{{ error_logs.stdout_lines | length | default(0) }}"
      when: error_logs is defined

    - name: Display summary
      debug:
        msg: 
          - "📊 Summary:"
          - "  Log file: {{ log_file }}"
          - "  Total error lines found: {{ total_error_lines | default(0) }}"
          - "  Displayed: {{ error_lines_count if error_lines_count > 0 else 'All' }} lines"
          - "  Privilege escalation: {{ 'Sudo was used' if needs_sudo else 'No sudo needed (user has read permissions)' }}"

