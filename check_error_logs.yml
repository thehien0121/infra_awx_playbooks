---
- name: Check Error Logs on CentOS/Ubuntu
  hosts: all
  gather_facts: yes

  vars:
    # Số dòng error cuối cùng muốn hiển thị (để trống hoặc 0 để hiển thị tất cả)
    error_lines_count: 50
    # Các từ khóa để tìm error (có thể tùy chỉnh)
    error_keywords:
      - error
      - ERROR
      - failed
      - FAILED
      - critical
      - CRITICAL
      - fatal
      - FATAL
      - exception
      - EXCEPTION

  tasks:
    - name: Detect OS and set log file path
      set_fact:
        log_file: "{{ '/var/log/messages' if ansible_os_family == 'RedHat' else '/var/log/syslog' }}"
        os_name: "{{ ansible_distribution }}"
        os_version: "{{ ansible_distribution_version }}"

    - name: Display OS information
      debug:
        msg: 
          - "Detected OS: {{ os_name }} {{ os_version }}"
          - "Using log file: {{ log_file }}"
          - "Current user: {{ ansible_user_id }}"

    - name: Try to read error logs without sudo (CentOS)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      register: error_logs
      when: ansible_os_family == "RedHat"
      changed_when: false
      failed_when: false

    - name: Try to read error logs without sudo (Ubuntu)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      register: error_logs
      when: ansible_os_family == "Debian"
      changed_when: false
      failed_when: false

    - name: Set needs_sudo flag
      set_fact:
        needs_sudo: "{{ (error_logs.rc is defined and error_logs.rc != 0) or (error_logs.stdout is not defined) or (error_logs.stdout == '') }}"
      when: error_logs is defined

    - name: Initialize needs_sudo if not set
      set_fact:
        needs_sudo: false
      when: error_logs is not defined or needs_sudo is not defined

    - name: Read error logs with sudo (CentOS)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      become: yes
      become_method: sudo
      register: error_logs
      when: 
        - ansible_os_family == "RedHat"
        - needs_sudo
      changed_when: false
      failed_when: false

    - name: Read error logs with sudo (Ubuntu)
      shell: |
        if [ {{ error_lines_count | int }} -gt 0 ]; then
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }} | tail -n {{ error_lines_count }}
        else
          grep -iE "{{ error_keywords | join('|') }}" {{ log_file }}
        fi
      become: yes
      become_method: sudo
      register: error_logs
      when: 
        - ansible_os_family == "Debian"
        - needs_sudo
      changed_when: false
      failed_when: false

    - name: Display error logs
      debug:
        msg: "{{ error_logs.stdout_lines }}"
      when: 
        - error_logs is defined
        - error_logs.stdout_lines is defined
        - error_logs.stdout_lines | length > 0

    - name: Show message if no errors found
      debug:
        msg: "✅ No error logs found in {{ log_file }}"
      when: 
        - error_logs is defined
        - (error_logs.stdout_lines is not defined) or (error_logs.stdout_lines | length == 0)

    - name: Count total error lines
      set_fact:
        total_error_lines: "{{ error_logs.stdout_lines | length | default(0) }}"
      when: error_logs is defined

    - name: Display summary
      debug:
        msg: 
          - "📊 Summary:"
          - "  Log file: {{ log_file }}"
          - "  Total error lines found: {{ total_error_lines | default(0) }}"
          - "  Displayed: {{ error_lines_count if error_lines_count > 0 else 'All' }} lines"
          - "  Privilege escalation: {{ 'Sudo was used' if needs_sudo else 'No sudo needed (user has read permissions)' }}"

